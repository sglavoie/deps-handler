# deps-merger config. `deps-merger init` writes this file to
# ~/.config/deps-merger/config.yaml ($XDG_CONFIG_HOME/deps-merger/config.yaml
# when that is set); `deps-merger repos` then shows the policy each repo gets.

# defaults apply to every repo; any repo entry can override any of them.
defaults:
  # squash | merge | rebase. A repo that does not allow it uses the first
  # one it does allow.
  merge_method: squash

  # patch | minor | major: the largest semver bump merged.
  max_update_type: minor

  # true: a PR with no CI checks is never merged. Skipped or neutral checks
  # do not count as having run.
  require_checks: true

  # Merge a PR whose latest commit has gone this long without any check
  # anyway, as on a repo whose CI only runs for some paths. Default 0:
  # never. At least 30m, the time CI is given to start, so 10m acts as 30m.
  # An error alongside require_checks: false, where it would do nothing.
  # merge_without_checks_after: 1h

  # true: with --review, the agent may approve updates over max_update_type
  # or of unknown size.
  # agent_review: true

# The AI agent `deps-merger run --review` uses to judge updates over
# max_update_type and of unknown size. --agent claude|codex overrides `use`.
agent:
  use: claude
  timeout: 15m              # per review
  claude:
    # model: opus           # unset: Claude Code's default
    # config_dir: ~/.claude # passed as CLAUDE_CONFIG_DIR; absolute or ~/.
    #                       # Unset: the one in your environment, if any.
    max_budget_usd: 2       # per review; 0 or unset: no cap
  codex:
    # model: gpt-5          # unset: Codex's default
    # home: ~/.codex        # passed as CODEX_HOME; absolute or ~/.
    #                       # Unset: the one in your environment, if any.

# Repos are written owner/name, without .git. An entry is a bare name, or a
# mapping with repo: and any of the defaults above to override. skip: true
# leaves a repo out of runs; naming it with --repo or adding
# --include-skipped still runs it, while --owner alone leaves it out.
repos:
  # Nothing runs until you list your own repos here, as the commented
  # examples below show (`deps-merger init --discover` can list them).
  # - acme/Storefront
  # - acme/Billing
  # - repo: acme/Mirror
  #   skip: true            # read-only access: nothing to merge
  # - repo: acme/auth-worker
  #   require_checks: false # no CI on this repo: explicit opt-in

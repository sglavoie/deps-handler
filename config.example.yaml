# deps-merger config. Copy to ~/.config/deps-merger/config.yaml
# ($XDG_CONFIG_HOME/deps-merger/config.yaml when that is set).
#
# defaults apply to every repo; any repo entry can override them.
#   merge_method:    squash | merge | rebase (falls back to what the repo allows)
#   max_update_type: patch | minor | major   (largest semver bump merged)
#   require_checks:  true = a PR with no CI checks is never merged...
#                    Skipped or neutral checks do not count as having run.
#   merge_without_checks_after: ...unless its latest commit has gone this
#                    long (e.g. 1h) without any check, as on a repo whose CI
#                    only runs for some paths (default 0: never; at least
#                    30m, the time CI is given to start, so 10m acts as 30m;
#                    an error alongside require_checks: false, where it does
#                    nothing)
#   agent_review:    true = with --review, the agent may approve updates over
#                    max_update_type or of unknown size (default true)
# A repo entry can also set skip: true to leave it out of runs; naming it
# with --repo or adding --include-skipped still runs it, while --owner
# alone leaves it out. Write repos as owner/name, without .git.
defaults:
  merge_method: squash
  max_update_type: minor
  require_checks: true

# The AI agent `deps-merger run --review` uses to judge updates over
# max_update_type and of unknown size. --agent claude|codex overrides `use`.
agent:
  use: claude
  timeout: 15m              # per review
  claude:
    model: opus             # empty: Claude Code's default
    config_dir: ~/.claude   # passed as CLAUDE_CONFIG_DIR; absolute or ~/
    max_budget_usd: 2       # per review; 0 or unset: no cap
  codex:
    model: ""               # empty: Codex's default
    home: ""                # passed as CODEX_HOME when set; absolute or ~/

repos:
  - acme/Billing
  - acme/docs
  - acme/Storefront
  - acme/Ingest
  - acme/Gateway
  - acme/Orders
  - repo: acme/Mirror
    skip: true              # read-only access: nothing to merge
  - acme/Metrics
  - acme/Search
  - acme/Monitor
  - repo: acme/auth-worker
    require_checks: false   # no CI on this repo: explicit opt-in

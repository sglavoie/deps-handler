# Builds release binaries when a v* tag is pushed (.github/workflows/release.yml).
# Check locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

before:
  hooks:
    - go mod tidy -diff
    # Shell completions, shipped in the archives and installed by the cask.
    - sh -c 'rm -rf completions && mkdir completions && for sh in bash zsh fish; do go run . completion "$sh" > "completions/deps-merger.$sh"; done'

builds:
  - env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sglavoie/deps-merger/cmd.Version={{ .Version }}
      - -X github.com/sglavoie/deps-merger/cmd.GitCommit={{ .ShortCommit }}
      - -X github.com/sglavoie/deps-merger/cmd.BuildTime={{ .Date }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - config.example.yaml
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      # With or without a scope, as in chore(deps): from Dependabot.
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"

homebrew_casks:
  - repository:
      owner: sglavoie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/sglavoie/deps-merger
    description: Merge safe Dependabot pull requests across your repositories
    license: MIT
    dependencies:
      - formula: gh
    completions:
      bash: completions/deps-merger.bash
      zsh: completions/deps-merger.zsh
      fish: completions/deps-merger.fish
    hooks:
      post:
        # The binaries are not notarized: let macOS run them.
        # install_steps writes Homebrew's postflight_steps; install wrote the
        # deprecated postflight, which warns on every install.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/deps-merger"]
          end

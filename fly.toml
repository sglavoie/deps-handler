# Fly.io: one machine, always on (the schedule runs in-process), with a
# volume for the SQLite database. Secrets, never in this file:
#   fly secrets set DMC_APP_ID=... DMC_WEBHOOK_SECRET=... DMC_PRIVATE_KEY="$(cat app.pem)"
# and, while dogfooding, DMC_REPOS=owner/name,... to bound what it runs.
# Merging stays off until DMC_ALLOW_MERGE=true is set, and then happens
# only where a repository's policy says mode: merge.
app = "deps-merger-cloud"
primary_region = "yul"

[build]

[env]
  PORT = "8080"
  DMC_DB = "/data/dmc.db"

[[mounts]]
  source = "dmc_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go tool govulncheck ./...
      - run: go test -race ./...
      - name: demo build
        run: |
          go vet -tags demo ./...
          go tool staticcheck -tags demo ./...
          go tool govulncheck -tags demo ./...
          go test -race -tags demo ./...
      # Releases ship Windows binaries, which no runner here builds.
      - name: windows build
        run: |
          GOOS=windows go vet ./...
          GOOS=windows go vet -tags demo ./...

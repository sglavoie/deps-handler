name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check before it builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "gofmt needed:"; gofmt -l .; exit 1)
      - name: go mod tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go tool govulncheck ./...
      - run: go test -race ./...
      - name: demo build
        run: |
          go vet -tags demo ./...
          go tool staticcheck -tags demo ./...
          go test -tags demo -run TestDemo ./cmd
      # Releases ship Windows binaries, which no runner here builds.
      - name: windows build
        run: |
          GOOS=windows go vet ./...
          GOOS=windows go vet -tags demo ./...
